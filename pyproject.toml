[project]
name = "pairs"
version = "0.1.0"
description = "walk-forward pairs trading on nse stocks with engle-granger cointegration"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "yfinance", "statsmodels"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pairs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
